[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "compras-back"
version = "0.1.0"
description = "API sencilla para una lista de compras compartida"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "sqlmodel>=0.0.24,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]


